version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bowling-tournament-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: bowling_user
      POSTGRES_PASSWORD: bowling_password
      POSTGRES_DB: bowling_tournament
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bowling_user -d bowling_tournament']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
